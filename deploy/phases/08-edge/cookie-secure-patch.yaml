# ADR-024 §7: auth sets cookies Secure once TLS terminates at the edge (SECURITY §2).
# The auth Deployment already runs with the browser via cluster-internal paths only —
# but the smoke flows hit /auth through the edge, so its cookies must carry Secure to be
# honored in a TLS browser context. Pod-template labels kept policy-compliant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nagar-app
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-auth-service
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: api
        nagar.io/phase: "07"
    spec:
      containers:
        - name: auth-service
          env:
            - name: COOKIE_SECURE
              value: "true"
