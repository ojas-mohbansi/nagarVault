apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Phase 8 — Edge & TLS (charter: PHASES.md §2). Phase boundary = directory boundary (I-9);
# nothing outside this subtree is touched except the app-of-apps registration and the
# ADR-024 §7 COOKIE_SECURE patch on the 7a Deployment env (cross-phase amendment precedent).
resources:
  - traefik-crd.yaml
  - traefik-deployment.yaml
  - certificates.yaml
  - ingressroutes.yaml
  - networkpolicy.yaml
# COOKIE_SECURE flip (ADR-024 §7): applied as a one-line value amendment in the 7a
# manifest itself — kustomize cannot patch an object outside this tree (a JSON6902
# target here is silently inert; a duplicate Deployment object here is invalid under
# SSA: "image: Required value", failed the phase8-5 sync 5×). Both falsified forms are
# recorded in ADR-024 field repairs (d); the tree comment above documents the I-9
# sanctioned exception.
components:
  - digest-pins
