# Phase 8 — Traefik edge (ADR-024). In-cluster deployment + LoadBalancer Service on 443.
# Labels per CONVENTIONS §5 (component: edge, tier per ARCHITECTURE §4.4 ordering).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-edge
  namespace: nagar-system
  labels:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: edge
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "08"
    nagar.io/tier: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-edge
  labels:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "08"
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  # EndpointSlices live in discovery.k8s.io, not core — the provider's informer needs
  # them at cluster scope (G8.3: their denial stalls cache sync exactly like a missing CRD).
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # This build (3.5.6) also runs a Node informer at cluster scope — a third RBAC gap
  # found only by watching the live reflectors; read-only node metadata, documented in
  # the mission log G8.3 (the deployed informer set is the authority, not the classic
  # Traefik RBAC recipe).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
      - traefikservices
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-edge
  labels:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "08"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-edge
subjects:
  - kind: ServiceAccount
    name: traefik-edge
    namespace: nagar-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-edge
  namespace: nagar-system
  labels:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: edge
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "08"
    nagar.io/tier: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-edge
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-edge
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: edge
        app.kubernetes.io/managed-by: argocd
        nagar.io/phase: "08"
        nagar.io/tier: "1"
      annotations:
        # Cold-config-reload trigger (G8.3): the provider can hold a stale failed
        # dynamic-config build after its informers replay mid-apply; a pod-template
        # annotation bump rolls the pod so Traefik rebuilds from the settled live
        # state (the k8s configmap-checksum idiom, applied deliberately).
        nagar.io/config-reload: "phase8-14-rule-precedence"
    spec:
      serviceAccountName: traefik-edge
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          # Rewritten by digest-pins/ to the registry-verified pin (I-5/I-11).
          image: registry.nagar.internal:5000/traefik:v3.5
          args:
            - "--entryPoints.websecure.address=:443"
            - "--entryPoints.ping.address=:8082"
            - "--providers.kubernetescrd.allowExternalNameServices=false"
            - "--providers.kubernetesingress=false"
            # Ping rides a DEDICATED plaintext entrypoint on this build (3.5.6,
            # sha256:e157892e…): attached to the TLS entrypoint, /ping 404s even while
            # the entrypoint serves TLS — reproduced on plain Docker, so it is image
            # behavior, not substrate. (The earlier k3s-EPHT/manPage hypothesis was
            # tested and falsified: --ping.manpage=false is rejected by this build.
            # Evidence trail in ADR-024 field repairs and the mission log G8.3.)
            - "--ping=true"
            - "--ping.entrypoint=ping"
            - "--api.dashboard=false"
            - "--log.level=INFO"
            - "--accesslog=true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 443
              name: websecure
            - containerPort: 8082
              name: ping
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
              scheme: HTTP
            initialDelaySeconds: 4
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-edge
  namespace: nagar-system
  labels:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: edge
    nagar.io/phase: "08"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik-edge
    app.kubernetes.io/component: edge
  ports:
    - name: websecure
      port: 443
      targetPort: 443
      protocol: TCP
