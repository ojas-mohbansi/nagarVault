# Qdrant vector store (exemplar: docs/manifests/exemplars/qdrant-statefulset.yaml).
# Single node per ADR-005/006. The nagar_schema collection is a rebuildable cache of an
# idempotent computation (schemaIndexer), not a system of record — hence the modest PVC.
#
# Port registry (CONVENTIONS §4): 6333 HTTP + 6334 gRPC, frozen. Network exposure is handled by
# ../networkpolicies.yaml (6333 to namespace + nagar-app; 6334 namespace-only).
#
# volumeClaimTemplates declares the API-server-defaulted fields (apiVersion/kind/volumeMode)
# explicitly: Phase 3 proved Argo's client-side differ does not normalize that subtree, which
# starved auto-sync with a permanently OutOfSync StatefulSet (ADR-016 §3). Declaring them in git
# is the established fix — declare, never mask.
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: ai
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "06"
    nagar.io/tier: "4"
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: ai
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "06"
    nagar.io/tier: "4"
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: ai
        nagar.io/phase: "06"
        nagar.io/tier: "4"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          # Rewritten by ../digest-pins to the internal-registry digest pin (I-5/I-11).
          image: registry.nagar.internal:5000/qdrant:v1.15.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            # Storage under /qdrant/storage (exemplar path); tmp under the writable emptyDir.
            - name: QDRANT__STORAGE__STORAGE_DIR
              value: /qdrant/storage
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 6333 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    # apiVersion/kind/volumeMode declared: the API server defaults these into the stored object
    # and Argo's client-side differ does not normalize the VCT subtree (ADR-016 §3).
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 5Gi
