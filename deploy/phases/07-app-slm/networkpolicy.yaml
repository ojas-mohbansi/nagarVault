# NetworkPolicy: ONLY the flows slmService needs (SECURITY §8: "slm -> Ollama, Qdrant,
# queryService" + the sessions denylist check → Postgres + DNS).
#   ingress :4004 from same-namespace pods (frontend chatbot in 7g; edge in Phase 8 extends).
#   egress: ollama :11434, qdrant :6333 (HTTP only — no gRPC need), query-service :4003,
#           postgres :5432 (jti denylist), kube-dns :53. Nothing else — in particular NO
#           direct database access beyond the sessions check (the LLM path's data access
#           is exclusively through queryService).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slm-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-slm-service
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nagar-slm-service
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}          # same-namespace peers only (pre-edge posture)
      ports:
        - protocol: TCP
          port: 4004
  egress:
    - to:                          # Ollama (embed + generate)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:                          # Qdrant HTTP (RAG retrieval)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    - to:                          # queryService — the ONLY path to warehouse data
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nagar-query-service
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 4003
    - to:                          # sessions denylist check (shared JWT chain)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:                          # DNS — always present (SECURITY §8)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
