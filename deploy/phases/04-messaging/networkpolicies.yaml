# NetworkPolicies for the messaging tier (SECURITY §8). The namespace-wide `default-deny` and
# `allow-dns-egress` / `allow-intra-namespace-egress` policies already exist in this namespace
# (deploy/phases/03-object-cache/networkpolicies.yaml) and are NOT duplicated here — Phase 4 adds
# only the ingress rule the Kafka broker needs to exist at all.
#
# Why no egress rule: `allow-intra-namespace-egress` already permits pods in nagar-platform to
# reach any pod in the namespace (broker↔broker replication and the KRaft quorum, the topics Job
# → the bootstrap Service, the operator's AdminClient through the Service). Everything crossing
# the namespace boundary stays default-deny unless named below.
#
# Note on operator-generated policies: the Strimzi Cluster Operator would create its own
# listener NetworkPolicies at runtime. It is switched off (`STRIMZI_NETWORK_POLICY_GENERATION=false`
# in ../strimzi/strimzi-patches.yaml) so that (a) cluster state stays exactly what git declares
# (I-1) and (b) no "allow from anywhere" rule silently widens the default-deny posture.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: broker
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "04"
    nagar.io/tier: "2"
spec:
  # Strimzi's OWN broker selector, identical to Service/kafka-bootstrap and to
  # `nagar-kafka-bootstrap`. A selector on `app.kubernetes.io/component: broker` would match no
  # pod at all: the operator drops that key from pod templates and overwrites
  # `app.kubernetes.io/name` with `kafka` (../kafka.yaml header note 5, ADR-017 §4).
  podSelector:
    matchLabels:
      strimzi.io/broker-role: "true"
      strimzi.io/cluster: nagar
      strimzi.io/kind: Kafka
      strimzi.io/name: nagar-kafka
  policyTypes: ["Ingress"]
  ingress:
    # Three rules, one per listener, each with the minimum sources that actually use it. Strimzi
    # 1.x runs more than the client listener (see the broker's own
    # `listeners=CONTROLPLANE-9090://…,REPLICATION-9091://…,PLAIN-29092://…` line), and getting
    # this wrong is silent: the broker starts and serves clients perfectly while the operator's
    # admin client quietly times out. Measured, not assumed — probing 9090/9091/29092 from the
    # operator pod gave BLOCKED/BLOCKED/OPEN with only 29092 allowed, which is exactly why every
    # reconciliation was stuck on `Error getting broker config: TimeoutException`.
    #
    #   PLAIN-29092 (frozen client port, CONVENTIONS §4 / ADR-009) — in-namespace clients (the
    #     topics Job now; migration Jobs in Phase 5), nagar-app producers/consumers (ingestion
    #     backend 7e, enrichWorker 7c), and the Phase-9 kafka-exporter.
    #
    #     The exporter peer is namespace+pod scoped, NOT the whole nagar-observability
    #     namespace: a bare namespaceSelector would admit every observability pod (Grafana,
    #     Loki, Alloy, Prometheus) to the broker, which is not a flow any of them has.
    #     NetworkPolicyPeer ANDs the two selectors, so this admits exactly one pod.
    #
    #     Why it was missing: this rule was written in Phase 4, when the only cross-namespace
    #     consumer was nagar-app. Phase 9 added `nagar-kafka-exporter` and gave IT an egress
    #     rule, but NetworkPolicy is evaluated on both sides — the broker's ingress half was
    #     never widened, so the exporter crash-looped on
    #     `Error Init Kafka Client: … dial tcp <bootstrap>:29092: connect: connection refused`
    #     for its entire life. Confirmed by probe, not by reading: from a pod with an egress
    #     rule (nagar-app/enrich-worker) the same ClusterIP connects fine, while nagar-alloy
    #     is dropped — netpol is enforced, and the exporter's own egress was never the
    #     problem. Same class as OPERATIONS §12.19.
    #   REPLICATION-9091 (broker-to-broker + the Cluster Operator's AdminClient) — in-namespace
    #     pods and nagar-system, where the operator runs.
    #   CONTROLPLANE-9090 (KRaft quorum, TLS) — broker pods only. The operator has no business
    #     on the metadata quorum, so it is NOT in this rule even though it is in the one above.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nagar-kafka-exporter
      ports:
        - protocol: TCP
          port: 29092
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-system
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9090
---
# Brokers must reach the Kubernetes API (egress).
#
# Strimzi 1.x no longer mounts the cluster CA / trust bundle as a volume: the broker loads it
# through Kafka's `KubernetesSecretConfigProvider`, i.e. it reads Secret `nagar-trustbundle`
# over the API server *before it can start*. Upstream states the requirement plainly ("to use
# the Kubernetes Configuration Provider plugin, you must set up access rights to..."), and
# there is no feature gate to switch back to volume-mounted secrets — checked the operator's
# live feature-gate set, not just its docs. Without this rule the broker CrashLoopBackOffs on
# `Failed to retrieve Secret nagar-trustbundle ... java.net.ConnectException`, which is what the
# namespace-wide `default-deny` from Phase 3 does to it by design.
#
# Why the rule is port-scoped instead of peer-scoped: a NetworkPolicy peer must be a pod
# selector, a namespace selector, or an ipBlock, and the API server is none of those here (in
# k3s it is a host process, not a pod and not in any namespace). Naming it by ipBlock would mean
# hard-coding a substrate address, and the address a rule would have to match is ambiguous
# anyway — the ClusterIP form (443) is rewritten by service DNAT to the node's API port (6443)
# before egress policy is evaluated on most CNIs, so any single CIDR guess is a coin flip. The
# rule therefore allows exactly the two API ports to any destination and relies on two bounds:
# the cluster has no route off-box (I-11), and every other port stays denied by `default-deny`.
# A real deployment replaces this with its control-plane ipBlock per the Kubernetes NetworkPolicy
# guidance; the port list is the portable part.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-api-egress
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: broker
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "04"
    nagar.io/tier: "2"
spec:
  podSelector:
    matchLabels:
      strimzi.io/broker-role: "true"
      strimzi.io/cluster: nagar
      strimzi.io/kind: Kafka
      strimzi.io/name: nagar-kafka
  policyTypes: ["Egress"]
  egress:
    - ports:
        # `kubernetes` Service ClusterIP form
        - protocol: TCP
          port: 443
        # post-DNAT form (the k3s API server port)
        - protocol: TCP
          port: 6443
