# G9.6 — Kyverno full-set admission probes. Apply this file; exactly three objects must be
# DENIED by admission:
#
#   p9-violation-tag-only   → require-image-digest     (internal registry, but :day0 tag)
#   p9-violation-registry   → restrict-image-registries (digest-pinned, but docker.io host)
#   p9-violation-hostnet    → hostNetwork is rejected — but see the precedence note below
#
# and one must be ADMITTED:
#
#   p9-control-compliant    → internal registry + digest + restricted context (it runs and
#                             sleeps, proving the policies do not deny compliant pods too)
#
# The control is deleted after the probe; the namespace is nagar-observability (enforce scope).
#
# PRECEDENCE NOTE (corrected after the 2026-10-03 run; earlier versions of this comment implied
# Kyverno decided all three). Every mission namespace carries
# pod-security.kubernetes.io/enforce=restricted, and the in-tree PodSecurity admission plugin
# runs BEFORE validating webhooks, so inside nagar-observability the third probe is rejected as
#   pods "p9-violation-hostnet" is forbidden: violates PodSecurity "restricted:v1.31"
# and `disallow-host-access` is never evaluated there. That policy is still live and Enforce; it
# is proven where PSA does not preempt it — in an UNLABELED namespace, applied with
# --dry-run=server so admission runs in full and nothing is persisted:
#
#   kubectl apply --dry-run=server -f <same spec, namespace: default, hostNetwork: true>
#     → admission webhook "validate.kyverno.svc-fail" denied the request:
#       disallow-host-access: no-host-namespaces … failed at path /spec/hostNetwork/
#   kubectl apply --dry-run=server -f <identical spec minus hostNetwork>
#     → pod/p9-probe-control-kyverno created (server dry run)
#
# (Mission log G9.8.)
---
apiVersion: v1
kind: Pod
metadata:
  name: p9-violation-tag-only
  namespace: nagar-observability
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
    nagar.io/p9-fixture: "policy-violation"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: k3d-nagar.localhost:5000/mission/busybox:day0
      command: ["/bin/sh", "-c", "sleep 5"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: p9-violation-registry
  namespace: nagar-observability
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
    nagar.io/p9-fixture: "policy-violation"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      # Same bytes as the internal busybox, addressed by its upstream name — the registry
      # policy must deny on the host prefix alone (nothing is pulled; admission precedes it).
      image: docker.io/library/busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
      command: ["/bin/sh", "-c", "sleep 5"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: p9-violation-hostnet
  namespace: nagar-observability
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
    nagar.io/p9-fixture: "policy-violation"
spec:
  restartPolicy: Never
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: k3d-nagar.localhost:5000/mission/busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
      command: ["/bin/sh", "-c", "sleep 5"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: p9-control-compliant
  namespace: nagar-observability
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
    nagar.io/p9-fixture: "policy-control"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: control
      image: k3d-nagar.localhost:5000/mission/busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
      command: ["/bin/sh", "-c", "echo 'p9 control: admitted'; sleep 10"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
