# Phase 9 — log collector (ADR-026 §1). Grafana Alloy, not Promtail.
#
# The PSS `restricted` profile enforced in every mission namespace forbids hostPath
# volumes, so a file-tailing collector cannot run at all (probe evidence in the mission
# log: the API server rejects the pod with "restricted volume types … hostPath"). Alloy's
# loki.source.kubernetes tails container logs **through the API server** instead — no
# hostPath, no privileged mounts, and the same PSS-restricted shape as every other pod.
#
# Cost of the choice, stated plainly: the API server now streams pod logs (one watch per
# target) instead of the node reading its own disk. At this cluster's scale (single node,
# a few dozen pods) that is negligible; a multi-node deployment should revisit it and
# would need a PSS carve-out for a file-tailing DaemonSet (ADR-026 records this).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagar-alloy
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-alloy
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "09"
    nagar.io/tier: "0"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nagar-alloy
  labels:
    app.kubernetes.io/name: nagar-alloy
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nagar-alloy
  labels:
    app.kubernetes.io/name: nagar-alloy
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nagar-alloy
subjects:
  - kind: ServiceAccount
    name: nagar-alloy
    namespace: nagar-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nagar-alloy-config
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-alloy
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
data:
  config.alloy: |
    logging {
      level  = "warn"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Tag every stream with the identity an operator queries by. The cluster's
    // namespace/pod labels stay what they are; these are Loki stream labels only.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://nagar-loki.nagar-observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagar-alloy
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-alloy
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "09"
    nagar.io/tier: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-alloy
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: observability
        nagar.io/phase: "09"
        nagar.io/tier: "0"
    spec:
      serviceAccountName: nagar-alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: registry.nagar.internal:5000/alloy:v1.3.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
            - /etc/alloy/config.alloy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 12345
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /-/ready, port: 12345}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: 12345}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
      volumes:
        - name: config
          configMap:
            name: nagar-alloy-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
