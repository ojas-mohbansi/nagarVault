# Phase 9 — kube-state-metrics: cluster object state (pod waiting reasons, restarts,
# replica availability) — the source for the PodCrashLooping alert and the workload
# panels. The RBAC list is the subset of upstream's ClusterRole covering the object
# kinds the dashboards and rules query; nothing broader.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagar-kube-state-metrics
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-kube-state-metrics
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "09"
    nagar.io/tier: "0"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nagar-kube-state-metrics
  labels:
    app.kubernetes.io/name: nagar-kube-state-metrics
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services", "endpoints", "persistentvolumeclaims", "persistentvolumes", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nagar-kube-state-metrics
  labels:
    app.kubernetes.io/name: nagar-kube-state-metrics
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nagar-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: nagar-kube-state-metrics
    namespace: nagar-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagar-kube-state-metrics
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-kube-state-metrics
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "09"
    nagar.io/tier: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-kube-state-metrics
  template:
    metadata:
      annotations:
        # Bump when the collector set or probes change (pod template hash is otherwise stable).
        nagar.io/config-rev: "1"
      labels:
        app.kubernetes.io/name: nagar-kube-state-metrics
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: observability
        nagar.io/phase: "09"
        nagar.io/tier: "0"
    spec:
      serviceAccountName: nagar-kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.nagar.internal:5000/kube-state-metrics:v2.14.0
          args:
            - --port=8080
            - --telemetry-port=8081
            # Explicit collector set. Without this KSM starts a reflector for every resource
            # kind it knows and exits 2 when any one is RBAC-forbidden (first sync did exactly
            # that with ingresses/secrets/CSRs). The set below is exactly the ClusterRole's
            # grant — least privilege, no reflector without permission.
            - --resources=namespaces,nodes,pods,services,endpoints,persistentvolumeclaims,persistentvolumes,resourcequotas,limitranges,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs,horizontalpodautoscalers,poddisruptionbudgets,storageclasses
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: telemetry
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # v2.14 splits the health surface: /livez and /healthz answer on the MAIN port
            # (8080), while the telemetry port (8081) serves only /readyz + self metrics.
            # Every wrong combination was probed live (404 → kubelet restart, exit 2).
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nagar-kube-state-metrics
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-kube-state-metrics
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
spec:
  selector:
    app.kubernetes.io/name: nagar-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: 8080
