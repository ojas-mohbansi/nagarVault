# Phase 9 — Loki (ADR-011's logs half). Single binary, filesystem storage on a PVC,
# no auth (cluster-internal only; nothing outside nagar-observability dials it except
# Alloy and Grafana — see networkpolicy.yaml). Retention: 7 days, enforced by the
# compactor, so the PVC is self-bounding on a 16 GB host.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nagar-loki-config
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-loki
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      retention_enabled: true
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagar-loki-data
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-loki
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagar-loki
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-loki
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "09"
    nagar.io/tier: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-loki
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: observability
        nagar.io/phase: "09"
        nagar.io/tier: "0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # loki image's own user
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: registry.nagar.internal:5000/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
          # Startup gate first: Loki's first boot (TSDB index + compactor start) can exceed
          # the liveness window, and the first sync proved it — the container was SIGTERM'd
          # gracefully at ~60 s and restarted "Completed exit=0". The startup probe gives it
          # 150 s of grace before readiness/liveness start counting.
          startupProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /live, port: 3100}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
      volumes:
        - name: config
          configMap:
            name: nagar-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: nagar-loki-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nagar-loki
  namespace: nagar-observability
  labels:
    app.kubernetes.io/name: nagar-loki
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "09"
spec:
  selector:
    app.kubernetes.io/name: nagar-loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
