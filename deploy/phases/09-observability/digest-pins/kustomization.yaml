apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Digest pins for every Phase 9 image (invariant I-5). Resolution 2026-10-02: each upstream
# image was pulled on the host and staged into the internal registry via localhost:35000.
#
# IMPORTANT, and the reason this file was corrected within the phase: the digest must be the
# registry's OWN `Docker-Content-Digest` for the pushed manifest, not the local RepoDigests
# value. Docker Desktop's containerd store records the pre-push multi-platform *index* digest
# there, while the registry holds a converted single-platform manifest with a different digest —
# pinning the index digest makes every kubelet pull 404 (first phase-9 sync did exactly that;
# evidence and error text in the mission log G9.1). The values below were read from
# `curl -sI .../v2/mission/<repo>/manifests/<tag>` after the push.
#
#   prom/prometheus:v3.5.0                        → sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
#   quay.io/prometheus/alertmanager:v0.28.0       → sha256:9139cd2c7ab7ff951e5ed9ffc4f70122a7de9678fb51065061a5f72549c91bab
#   registry.k8s.io/kube-state-metrics:v2.14.0    → sha256:21c8c43f40b09a9a26b2f1252603c654855ace00c7a6b7a440eba3e2a9dac1c9
#   grafana/grafana:11.4.0                        → sha256:8d938a1c52b018c60cb3583657e038054387aa18a74f09a865c99a522481f7ac
#   grafana/loki:3.3.2                            → sha256:e9d0a18363c9c3022aef6793a7e135000d11127fb0e18b89de08b1e21e629d60
#   grafana/alloy:v1.3.1                          → sha256:2381097248235e37c34a727103cf9ad0e11767defdab6f37646cff09acd2dbaf
#   danielqsj/kafka-exporter:v1.7.0              → sha256:dd9a70f08d5f9c3173ce12a41736f342271d3cd4d7e9cf46e5546d99d7d79ddd
#
# NOT staged: grafana/promtail:3.3.2. It was staged (digest recorded in the mission log) and then
# rejected at design time: PSS `restricted` forbids hostPath volumes, so a file-tailing collector
# cannot run in nagar-observability at all. Log collection uses Alloy's API-based tailing instead
# — ADR-026 §3 records the deviation.
images:
  - name: registry.nagar.internal:5000/prometheus
    newName: k3d-nagar.localhost:5000/mission/prometheus
    digest: sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
  - name: registry.nagar.internal:5000/alertmanager
    newName: k3d-nagar.localhost:5000/mission/alertmanager
    digest: sha256:9139cd2c7ab7ff951e5ed9ffc4f70122a7de9678fb51065061a5f72549c91bab
  - name: registry.nagar.internal:5000/kube-state-metrics
    newName: k3d-nagar.localhost:5000/mission/kube-state-metrics
    digest: sha256:21c8c43f40b09a9a26b2f1252603c654855ace00c7a6b7a440eba3e2a9dac1c9
  - name: registry.nagar.internal:5000/grafana
    newName: k3d-nagar.localhost:5000/mission/grafana
    digest: sha256:8d938a1c52b018c60cb3583657e038054387aa18a74f09a865c99a522481f7ac
  - name: registry.nagar.internal:5000/loki
    newName: k3d-nagar.localhost:5000/mission/loki
    digest: sha256:e9d0a18363c9c3022aef6793a7e135000d11127fb0e18b89de08b1e21e629d60
  - name: registry.nagar.internal:5000/alloy
    newName: k3d-nagar.localhost:5000/mission/alloy
    digest: sha256:2381097248235e37c34a727103cf9ad0e11767defdab6f37646cff09acd2dbaf
  - name: registry.nagar.internal:5000/kafka-exporter
    newName: k3d-nagar.localhost:5000/mission/kafka-exporter
    digest: sha256:dd9a70f08d5f9c3173ce12a41736f342271d3cd4d7e9cf46e5546d99d7d79ddd
