# Phase 9 child Application (app-of-apps). The tree spans nagar-observability (the
# stack), nagar-system (the Traefik scrape widening) and cluster scope (RBAC, Kyverno
# policies) — the resources carry absolute namespaces, so ServerSideApply is used and
# destination.namespace is only the default for namespace-less objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagar-phase9-observability
  namespace: nagar-system
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "9"
spec:
  project: nagar
  source:
    repoURL: git://git-repo-mirror.nagar-system.svc.cluster.local:9418/nagarvault.git
    targetRevision: HEAD
    path: deploy/phases/09-observability
  destination:
    server: https://kubernetes.default.svc
    namespace: nagar-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
