# Forward-declared Phase 3 child (charters demand the app-of-apps owns the phase tree
# from day one; the directory fills in the next phase and the app converges on its own
# — the zero-touch property this phase exists to prove).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagar-phase3-object-cache
  namespace: nagar-system
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "2"
spec:
  project: nagar
  source:
    repoURL: git://git-repo-mirror.nagar-system.svc.cluster.local:9418/nagarvault.git
    targetRevision: HEAD
    path: deploy/phases/03-object-cache
  destination:
    server: https://kubernetes.default.svc
    namespace: nagar-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
