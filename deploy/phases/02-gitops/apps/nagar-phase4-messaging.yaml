# Forward-declared Phase 4 child (see nagar-phase3-object-cache.yaml rationale).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nagar-phase4-messaging
  namespace: nagar-system
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "2"
spec:
  project: nagar
  source:
    repoURL: git://git-repo-mirror.nagar-system.svc.cluster.local:9418/nagarvault.git
    targetRevision: HEAD
    path: deploy/phases/04-messaging
  destination:
    server: https://kubernetes.default.svc
    namespace: nagar-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
