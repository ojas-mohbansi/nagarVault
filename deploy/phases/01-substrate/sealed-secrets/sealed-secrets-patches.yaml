# Patches onto the vendored sealed-secrets bundle (third_party stays pristine; ADR-002).
# 1) The ClusterRoleBinding and RoleBinding carry a ServiceAccount subject hardcoded to
#     kube-system; the relocation to nagar-system (namespace transformer does not rewrite
#     RBAC subjects) is completed by pinning both subject namespaces here.
# 2) The controller container ships without resources — the require-pod-security-context
#     policy (I-4) would deny admission; minimal sizing for the ~8 GB allocation (risk R1).
# 3) The pod template gains the mission labels `require-nagar-labels` evaluates
#     (app.kubernetes.io/part-of + nagar.io/phase). Same latent-Phase-1-flaw class the
#     cert-manager patch records: only the Namespace was labeled at first, so the
#     controller pod was admitted before the ClusterPolicies went live and kept running,
#     leaving 2 background-scan fails in nagar-system (a mission namespace) until the
#     2026-10-03 audit's repaired check surfaced them. These are the two labels the
#     policy checks, matching the sibling cert-manager/kyverno control-plane pods.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: nagar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Matches the bundle's explicit namespace; the `namespace: nagar-system`
  # transformer rewrites both after patches apply.
  namespace: kube-system
  name: sealed-secrets-controller
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: nagar-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Matches the bundle's explicit namespace (patches run before the namespace
  # transformer, which then rewrites it to nagar-system).
  namespace: kube-system
  name: sealed-secrets-controller
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "1"
    spec:
      containers:
        - name: sealed-secrets-controller
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
