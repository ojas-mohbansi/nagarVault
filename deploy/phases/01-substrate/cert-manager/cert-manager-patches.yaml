# Patches onto the vendored cert-manager bundle (third_party stays pristine; ADR-002).
# 1) The bundle's Namespace gains the PSS restricted labels the other mission
#    namespaces carry (its Deployment pods are natively restricted-compliant —
#    audited in ../../../third_party/README.md).
# 2) The three deployments ship without resource requests/limits — the
#    require-pod-security-context policy (I-4) would deny admission. Values are
#    minimal single-node sizing for the current ~8 GB Docker allocation (risk R1).
# 3) The pod templates gain the mission labels `require-nagar-labels` evaluates
#    (app.kubernetes.io/part-of + nagar.io/phase). This patch is a 2026-09-29 Phase-5-era
#    repair of a latent Phase-1 flaw, kept honest in the mission log: the original Phase-1
#    tree patched only the Namespace labels, so the first pods were admitted BEFORE the
#    ClusterPolicies went live and kept running; Argo saw no drift because git itself never
#    declared the labels. The Docker-VM restart forced pod re-creation against the now-live
#    policy, which denied every pod (`check-part-of-label` + `check-phase-label`) and left
#    cert-manager with zero replicas. Every other mission namespace's patches carried these
#    template labels from day one — this file was the only gap. Lesson (same class as the
#    Phase-4 silent selector failure): a policy that only ever evaluated pre-existing pods
#    proves nothing; the negative test must create a pod.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "1"
    pod-security.kubernetes.io/enforce: "restricted"
    pod-security.kubernetes.io/enforce-version: v1.31
    pod-security.kubernetes.io/audit: "restricted"
    pod-security.kubernetes.io/audit-version: v1.31
    pod-security.kubernetes.io/warn: "restricted"
    pod-security.kubernetes.io/warn-version: v1.31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "1"
    spec:
      containers:
        - name: cert-manager-controller
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-cainjector
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "1"
    spec:
      containers:
        - name: cert-manager-cainjector
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-webhook
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "1"
    spec:
      containers:
        - name: cert-manager-webhook
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
