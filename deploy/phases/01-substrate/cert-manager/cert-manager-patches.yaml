# Patches onto the vendored cert-manager bundle (third_party stays pristine; ADR-002).
# 1) The bundle's Namespace gains the PSS restricted labels the other mission
#    namespaces carry (its Deployment pods are natively restricted-compliant —
#    audited in ../../../third_party/README.md).
# 2) The three deployments ship without resource requests/limits — the
#    require-pod-security-context policy (I-4) would deny admission. Values are
#    minimal single-node sizing for the current ~8 GB Docker allocation (risk R1).
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "1"
    pod-security.kubernetes.io/enforce: "restricted"
    pod-security.kubernetes.io/enforce-version: v1.31
    pod-security.kubernetes.io/audit: "restricted"
    pod-security.kubernetes.io/audit-version: v1.31
    pod-security.kubernetes.io/warn: "restricted"
    pod-security.kubernetes.io/warn-version: v1.31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager
spec:
  template:
    spec:
      containers:
        - name: cert-manager-controller
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-cainjector
spec:
  template:
    spec:
      containers:
        - name: cert-manager-cainjector
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-webhook
spec:
  template:
    spec:
      containers:
        - name: cert-manager-webhook
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
