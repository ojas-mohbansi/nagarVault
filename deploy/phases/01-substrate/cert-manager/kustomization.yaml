# cert-manager: upstream bundle stays in its native `cert-manager` namespace
# (the bundle ships its own Namespace + webhook wiring) and gets PSS labels plus
# mandatory resources via patches (see cert-manager-patches.yaml; audit trail in
# ../../../third_party/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cross-root reference to deploy/third_party/ (ADR-002 layout): build with
# `kustomize build --load-restrictor LoadRestrictionsNone` (see phase README).
namespace: cert-manager
resources:
  - ../../../third_party/cert-manager/v1.16.4/cert-manager.yaml
# Multi-doc SMP file: each document self-identifies by apiVersion/kind/name, so no
# per-entry target selector is allowed (kustomize restriction).
patches:
  - path: cert-manager-patches.yaml
  - path: cert-manager-le-args-patch.yaml
components:
  - ../digest-pins
