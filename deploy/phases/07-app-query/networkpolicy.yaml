# NetworkPolicy: ONLY the flows queryService needs (SECURITY §8).
#   ingress :4003 from same-namespace pods (slmService /ask path in 7d; frontend via edge
#   in Phase 8 extends the peer list). NOTE: slmService forwards the officer's JWT; it does
#   NOT get database access of its own — the DB wall is this service's egress only.
#   egress: postgres-rw :5432 in nagar-platform + kube-dns :53 UDP+TCP. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-query-service
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nagar-query-service
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}          # same-namespace peers only (pre-edge posture)
      ports:
        - protocol: TCP
          port: 4003
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:                          # DNS — always present (SECURITY §8)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
