# queryService — Phase 7b (ADR-013 fresh rebuild; charter: PHASES.md §2 micro-phase 7b).
#
# Exemplar-parity shape follows the Phase-7a pattern established against
# docs/manifests/exemplars/auth-service-deployment.yaml (no queryService exemplar exists):
# ServiceAccount, Service :4003 (frozen registry, CONVENTIONS §4), Deployment replicas 2
# with maxUnavailable 0, PDB minAvailable 1, NetworkPolicy (networkpolicy.yaml).
# Live-state corrections, each at the point of deviation:
#   1. DATABASE_URL from secretKeyRef nagar-postgres-app key `databaseUrl` (SECURITY §6.2).
#   2. Pod-template labels carry nagar.io/phase "07" + part-of (§12.23) and a writable /tmp
#      emptyDir under the read-only root (7a lesson).
#   3. No admin bypass: admin JWTs get NO warehouse tables (SECURITY §3) — enforced in code
#      and re-checked by the Phase-5 grant wall (nagar has no admin-granted warehouse role).
#
# Secrets consumed already exist from Phase 1 (nagar-jwt, nagar-postgres-app) — I-3.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagar-query-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-query-service
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "07"
    nagar.io/tier: "6"
spec:
  selector:
    app.kubernetes.io/name: nagar-query-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4003          # frozen registry, CONVENTIONS §4
      targetPort: 4003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-query-service
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "07"
    nagar.io/tier: "6"
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-query-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-query-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "07"
        nagar.io/tier: "6"
        nagar.io/scrape: "true"
    spec:
      serviceAccountName: nagar-query-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query-service
          # Rewritten by digest-pins/ to the registry-verified pin (I-5/I-11).
          image: registry.nagar.internal:5000/nagar-query-service:phase7b-1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Writable scratch only; nothing durable at runtime (I-2, 7a lesson).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 4003
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nagar-postgres-app, key: databaseUrl }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: nagar-jwt, key: jwtSecret }
          readinessProbe:
            httpGet: { path: /dbcheck, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 4003 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: query-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-query-service
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-query-service
      app.kubernetes.io/component: api
