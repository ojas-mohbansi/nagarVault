# Exemplar-shaped Redis (docs/manifests/exemplars/redis-statefulset.yaml): ephemeral by
# design — upload intents and dedup keys are TTL-managed, so no persistence and no
# backups (OPERATIONS §7); no PVC intentionally (deleting the StatefulSet deletes
# nothing of value, per the phase's rollback notes).
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "03"
    nagar.io/tier: "1"
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: storage
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "03"
    nagar.io/tier: "1"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: storage
        app.kubernetes.io/managed-by: argocd
        nagar.io/phase: "03"
        nagar.io/tier: "1"
    spec:
      securityContext:
        # redis:7-alpine ships a `redis` user (uid 999) and its entrypoint drops
        # privileges; the explicit runAsUser satisfies both PSA and the require-pod-
        # security-context policy under containerd's uid verification.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: registry.nagar.internal:5000/redis@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
          args: ["--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
