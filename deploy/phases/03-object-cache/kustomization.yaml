# Phase 3 — Object store & cache (PHASES.md §2). MinIO + Redis StatefulSets (ADR-005/006),
# idempotent bucket-init Job (three frozen buckets), default-deny NetworkPolicies
# (SECURITY §8). Consumes the nagar-minio-server SealedSecret (nagar-platform copy of the
# MinIO credentials — see sealed-secret note in minio-statefulset.yaml header).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - minio-statefulset.yaml
  - redis-statefulset.yaml
  - bucket-init-job.yaml
  - networkpolicies.yaml
  - secrets
components:
  - digest-pins
