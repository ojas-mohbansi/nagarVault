# Idempotent schema migration Job (invariant I-2; exemplar
# docs/manifests/exemplars/postgres-migration-job.yaml). Applies every file in
# migrations/ in lexical order through the ConfigMap kustomize generates from that directory.
# NOTE: that ConfigMap lists files EXPLICITLY, not as a glob, so a new migration must
# also be added to kustomization.yaml. Adding the .sql alone ships nothing — found while
# landing 002_pii_column_grants.sql (ADR-030), which had to be registered before it would
# have been applied at all.
#
# Deviations from the exemplar, both load-bearing:
#
#   1. It connects as the **operator-managed superuser** (`postgres-superuser`, generated by
#      CloudNativePG in-cluster and never committed — I-3 is not strained). The exemplar connects
#      as the `nagar` owner with a `PGPASSWORD`, but this migration creates the officer roles and
#      reassigns object ownership, and the `nagar` role is deliberately not a superuser and holds
#      no CREATEROLE. Granting it CREATEROLE purely to satisfy the exemplar's credential choice
#      would widen the application role's privileges for the rest of the platform's life; using
#      the superuser for the ~1 second the migration runs does not.
#
#   2. A `wait-for-postgres` init container gates the migration on the `postgres-rw` service
#      accepting connections. Argo applies the whole phase tree in one sync, so without this the
#      Job would race a cluster that is still initialising its primary. `pg_isready` needs no
#      credentials — it only probes the port.
#
# The client image is the CloudNativePG operand rather than the exemplar's `postgres:15-alpine`:
# it already carries `psql`, so staging a second PostgreSQL image would add an artifact to mirror
# and verify for no capability (../digest-pins carries the full reasoning and the pin).
#
# The Job carries `Force=true,Replace=true` because its pod template embeds a kustomize
# content hash of the SQL: when the migration text changes, the Job template changes, and a Job
# template is immutable. This is the repository's established pattern for init Jobs
# (ADR-016 §2; the Phase-4 record flags the resulting per-sync recreation as an open item that
# applies equally to all three init Jobs).
apiVersion: batch/v1
kind: Job
metadata:
  name: nagar-db-migrate
  namespace: nagar-platform
  labels:
    app.kubernetes.io/name: nagar-db-migrate
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: init
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "05"
    nagar.io/tier: "3"
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-db-migrate
        app.kubernetes.io/part-of: nagarvault
        app.kubernetes.io/component: init
        nagar.io/phase: "05"
        nagar.io/tier: "3"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid 26 is the CloudNativePG operand image's postgres identity; the Jobs run as it so
        # that one image can serve the cluster and its clients (see ../digest-pins). fsGroup makes
        # the emptyDir HOME writable for a non-root uid under readOnlyRootFilesystem.
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: registry.nagar.internal:5000/cnpg-postgresql:15.17-system-trixie
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -h postgres-rw.nagar-platform.svc.cluster.local -p 5432 -t 5; do
                echo "waiting for postgres-rw to accept connections"
                sleep 2
              done
              echo "postgres-rw is accepting connections"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: migrate
          image: registry.nagar.internal:5000/cnpg-postgresql:15.17-system-trixie
          workingDir: /migrations
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for f in /migrations/*.sql; do
                echo "applying $f"
                psql -X -v ON_ERROR_STOP=1 -f "$f" "$DATABASE_URL"
              done
              echo "migrations complete"
          env:
            # The operator-generated superuser secret (kubernetes.io/basic-auth): username +
            # password. Nothing here is committed to git.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(PGUSER):$(PGPASSWORD)@postgres-rw.nagar-platform.svc.cluster.local:5432/nagardb
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          configMap:
            # Name carries a kustomize content hash; the reference is rewritten on build.
            name: nagar-db-migrations
        - name: tmp
          emptyDir: {}
