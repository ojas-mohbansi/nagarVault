apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SealedSecrets for the relational store (I-3: encrypted blobs only; SECURITY §6.1 workflow —
# encrypted offline against the live controller certificate, applied, unsealed by the controller).
#
# `nagar-postgres-bootstrap` (nagar-platform, kubernetes.io/basic-auth) exists because
# CloudNativePG's `bootstrap.initdb.secret` is how a cluster's application role password is
# *pinned* rather than generated: the secret's username must equal `initdb.owner` (`nagar`) and
# its password becomes that role's password. Pinning it here is what keeps the password equal to
# the one Phase 1 already sealed into the app tier's
# `nagar-app/nagar-postgres-app.databaseUrl` — otherwise CloudNativePG would generate its own
# password and the two halves of SECURITY §6.2's key map would disagree the moment Phase 7
# deploys a service. Rationale and alternatives: ADR-019 §5.
resources:
  - nagar-postgres-bootstrap-sealed.yaml
