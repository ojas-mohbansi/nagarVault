# SealedSecret — CloudNativePG bootstrap credentials for the `nagar` application role.
#
# Why this blob exists at all: CloudNativePG's `bootstrap.initdb.secret` is the mechanism that
# *pins* the application role's password instead of letting the operator generate one. The username
# must equal `spec.bootstrap.initdb.owner` (`nagar`), and the password becomes that role's password
# in the new cluster.
#
# Why the password is not a fresh one: Phase 1 already sealed the `nagar` password into the app
# tier's `nagar-app/nagar-postgres-app.databaseUrl`. Generating a different one here would split
# SECURITY §6.2's key map into two disagreeing halves, and repairing that later would mean
# re-sealing another phase's secret (I-9). The value in this blob is therefore the password already
# present in the cluster, re-sealed offline against the controller certificate; the plaintext was
# never printed, never committed and was shredded after sealing. Rotating it means re-sealing this
# blob and the app tier's `databaseUrl` in the same change (SECURITY §6.4).
#
# Rationale and alternatives: ADR-019 §5. Sealed with kubeseal 0.28.0, scope namespace+name strict.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: nagar-postgres-bootstrap
  namespace: nagar-platform
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "05"
      name: nagar-postgres-bootstrap
      namespace: nagar-platform
    type: kubernetes.io/basic-auth
