# enrichWorker — Phase 7c (ADR-013 fresh rebuild; charter: PHASES.md §2 micro-phase 7c).
#
# Exemplar-parity shape follows the Phase-7a/7b pattern (no worker exemplar exists):
# ServiceAccount + Deployment + PDB + NetworkPolicy (networkpolicy.yaml). Worker-specific
# corrections, each commented:
#   * NO Service and NO HTTP port: enrichWorker is a Kafka consumer process (CONVENTIONS §4
#     lists no port for it; ARCHITECTURE §4.1 lists no HTTP endpoints). Probes are exec-based.
#   * replicas: 1 — a single consumer per group keeps per-partition ordering and makes the
#     dedup/idempotency story trivially auditable on this substrate (ADR-006 single-node);
#     scale-out is a Phase-9+ concern with partitioned topics.
#   * pod-template mission labels (§12.23) and the writable /tmp emptyDir (7a lesson).
# Secrets: DATABASE_URL from nagar-postgres-app `databaseUrl` (SECURITY §6.2). Kafka is
# PLAINTEXT inside the namespace (Phase-4 topology, no SASL on the plain listener).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagar-enrich-worker
  namespace: nagar-app
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrich-worker
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-enrich-worker
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "07"
    nagar.io/tier: "6"
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-enrich-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-enrich-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: nagarvault
        nagar.io/phase: "07"
        nagar.io/tier: "6"
        nagar.io/scrape: "true"
    spec:
      serviceAccountName: nagar-enrich-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30   # let the consumer leave the group cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrich-worker
          # Rewritten by digest-pins/ to the registry-verified pin (I-5/I-11).
          image: registry.nagar.internal:5000/nagar-enrich-worker:phase7c-1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nagar-postgres-app, key: databaseUrl }
            - name: KAFKA_BOOTSTRAP
              value: nagar-kafka-bootstrap.nagar-platform.svc.cluster.local:29092
            - name: KAFKA_GROUP_ID
              value: enrichWorker
          # A consumer has no HTTP surface: readiness = the process can start its
          # dependencies (kafka + psycopg import + module load); liveness = the loop
          # module is still importable. The real end-to-end liveness is the topic→table
          # E2E (G7c.4) and consumer-lag monitoring lands with Phase 9.
          startupProbe:
            exec:
              command: ["python", "-c", "import enrich, psycopg, confluent_kafka"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["python", "-c", "import enrich"]
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enrich-worker
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-enrich-worker
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-enrich-worker
      app.kubernetes.io/component: worker
