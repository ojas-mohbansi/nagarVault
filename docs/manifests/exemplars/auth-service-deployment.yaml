# Exemplar: Application service — authService (Phase 7a template).
# Every Phase 7 micro-phase MUST produce this exact shape for its service, changing only:
# name, image digest, port, env vars, and NetworkPolicy peers. This file is the contract.
#
# Secrets: keys consumed via secretKeyRef; values are SealedSecrets (SECURITY §6.2 key map).
---
# SealedSecret placeholder — in the live tree this is generated by `kubeseal` (SECURITY §6.1).
# Shown expanded only to document the key contract for this service.
apiVersion: v1
kind: SealedSecret
metadata:
  name: nagar-postgres-app
  namespace: nagar-app
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  encryptedData:
    password: AgB...REPLACE_WITH_KUBESEALED_BLOB...   # never a plaintext value (I-3)
  template:
    metadata:
      name: nagar-postgres-app
    type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-auth-service
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "07"
    nagar.io/tier: "6"
spec:
  selector:
    app.kubernetes.io/name: nagar-auth-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000          # frozen registry, ADR-009 / CONVENTIONS §4
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-auth-service
    app.kubernetes.io/part-of: nagarvault
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: argocd
    nagar.io/phase: "07"
    nagar.io/tier: "6"
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-auth-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagar-auth-service
        app.kubernetes.io/component: api
        nagar.io/scrape: "true"
    spec:
      serviceAccountName: nagar-auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: registry.nagar.internal:5000/nagar-auth-service@sha256:REPLACE_WITH_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: postgresql://nagar:$(PGPASSWORD)@postgres-rw.nagar-platform.svc.cluster.local:5432/nagardb
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: nagar-postgres-app, key: password }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: nagar-jwt, key: jwtSecret }
            - name: COOKIE_SECURE
              value: "true"          # mandatory once edge TLS is live (Phase 8, SECURITY §2)
          readinessProbe:
            httpGet: { path: /dbcheck, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-auth-service
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagar-auth-service
      app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagar-auth-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/part-of: nagarvault
    nagar.io/phase: "07"
automountServiceAccountToken: false
---
# NetworkPolicy: ONLY the flows authService needs (SECURITY §8). Ingress from Traefik edge + peers;
# egress to Postgres + DNS. Everything else denied by namespace default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service
  namespace: nagar-app
  labels:
    app.kubernetes.io/name: nagar-auth-service
    nagar.io/phase: "07"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nagar-auth-service
      app.kubernetes.io/component: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-system   # Traefik runs in nagar-system (k3s bundled; relocate or extend per live topology)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nagar-frontend
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nagar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:                      # DNS — always present (SECURITY §8)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
